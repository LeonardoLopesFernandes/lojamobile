name: inventario
description: "App de Inventário."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_localizations:
    sdk: flutter

  # HTTP / API
  http: ^1.2.0

  # Persistência
  shared_preferences: ^2.2.2

  # Ícones vetoriais (logo do login)
  flutter_svg: ^2.0.9

  # WebView (fluxo Microsoft OAuth)
  webview_flutter: ^4.4.2
  mobile_scanner: ^7.4.2
  dio: ^5.11.1
  flutter_slidable: ^4.0.3
  path_provider: ^2.1.6
  pdf: ^3.12.0
  barcode: ^2.2.8
  lottie: ^3.1.2
  path_drawing: ^1.0.1
  share_plus: ^7.2.2
  sqflite: ^2.4.2+1
  path: ^1.9.1
  aad_oauth: ^1.0.1
  excel: ^4.0.0
  image: ^4.1.0
  image_picker: ^1.0.7
  intl: ^0.20.2
  provider: ^6.1.1
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/drawables/
    - assets/icons/
    - assets/overlays/
    - assets/lottie/
    - assets/fonts/

  fonts:
    - family: HelveticaNeueCondensed
      fonts:
        - asset: assets/fonts/HelveticaNeueCondensed.otf

