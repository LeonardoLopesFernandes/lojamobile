name: Build Flutter APK (arm64-v8a)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Decode release keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release-key.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK (somente arm64-v8a)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
          microsoftClientSecret: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
        run: |
          VERSION_CODE=$((2000 + BUILD_NUMBER))
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm64 \
            --build-number=$VERSION_CODE \
            --build-name="${GITHUB_REF_NAME#v}" \
            --dart-define=MICROSOFT_CLIENT_SECRET=$microsoftClientSecret \
            --dart-define=APP_VERSION=${GITHUB_REF_NAME} \
            --split-debug-info=build/symbols \
            --no-tree-shake-icons

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk lojamobile-release.apk

      - name: Cleanup keystore
        if: always()
        run: rm -f "${{ github.workspace }}/release-key.jks"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: Loja Mobile (${{ github.ref_type == 'tag' && github.ref_name || 'latest' }})
          body: |
            Build automático a partir do commit `${{ github.sha }}`.
            APK Flutter **arm64-v8a** (release).
            Instale sobre a versão anterior para atualizar (versionCode crescente).
          files: flutter/lojamobile-release.apk
          overwrite: true
          make_latest: true
